# Пороги светофора. Утверждает риск-менеджмент вашей организации. Значения по умолчанию подобраны на небольшой
# тестовой выборке — перепроверьте их на своей размеченной выборке (40–60 заказчиков с ручной оценкой цвета).

status:
  red_words: [банкрот, ликвидир, ликвидац, конкурсн]       # процедура идёт -> R1_status
  terminated_words: [исключ, прекрат, прекращен]       # компании нет -> R1_terminated
  yellow_words: [реорганиз, намерени]

bankruptcy:
  red_words: [наблюд, конкурс, внешн, реализац, введен, признан, санаци]
  intent_words: [намерен, заявлен, подал]
  intent_months: 12          # «намерение кредитора» старше — только для сведения
  big_company_revenue: 50.0e+9  # выше — единичные намерения кредиторов фон

arbitration:
  defendant_yellow: 0.10     # иски к компании / выручка
  defendant_red: 0.30
  year_share_yellow: 0.25
  defendant_cases_yellow: 5  # техпроект: «≥ 5 таких дел за 12 месяцев» — жёлтый…
  defendant_cases_min_share: 0.03  # …но без категории спора только при сумме исков ≥ 3 % выручки    # ВРЕМЕННОЕ правило «суды без роли», пока нет коннектора КАД

enforcement:                 # ФССП
  abs_min: 1.0e+6
  rel_min: 0.005
  abs_no_revenue: 5.0e+6

tax_debt:
  yellow_abs: 1.0e+6          # ниже — «для сведения»

finance:
  revenue_drop_yellow: 0.30  # падение выручки г/г
  min_revenue_for_drop: 10.0e+6
  stale_years: 2             # выручка старше — «отчётность скрыта»

structure:
  shell_revenue: 300.0e+6     # выручка, при которой ≤ shell_staff сотрудников — признак посредника
  shell_staff: 5
  address_mates_yellow: 5    # компаний по тому же адресу из открытых данных ФНС
  address_big_staff: 100     # крупнее — соседи по адресу только «для сведения»
  address_big_revenue: 1.0e+9
  director_changes_yellow: 2

coverage:
  green_min: 0.8             # зелёный только при проверке ≥ 4 из 5 каналов

graph:
  # перенос риска: уровень_связи = max по соседям: 1 (красный) × вес(ребро) × step_decay^(шаг−1)
  weights:
    parent_ge50: 1.0         # материнская / владелец-ЮЛ ≥ 50 %
    parent_unknown_share: 0.6  # владелец-ЮЛ, доля неизвестна (ЕГРЮЛ в pb.nalog.ru долю не даёт)
    child_ge50: 0.7
    child_unknown_share: 0.5
    director: 0.6            # общий руководитель / управляющий
    founder_fl: 0.5          # общий учредитель-ФЛ
    address: 0.2
    successor: 0.3           # правопредшественник в беде: классика «переезда от долгов»
    mass_person: 0.1         # ФЛ с > mass_person_companies компаний
  mass_person_companies: 20
  step_decay: 0.5
  red_at: 0.9
  yellow_at: 0.25
  info_at: 0.1
  no_propagation_rels: [конкурсный_управляющий]
  carry_rels: [учредитель, материнская, дочерняя, руководитель, управляющий, управляющий_ИП,
               управляющая_организация, тот_же_адрес, общий_адрес, правопредшественник]   # арбитражный управляющий ведёт чужие банкротства
  # для «сестёр» (шаг 2) в перенос идут только эти красные правила: прекращённые давно компании — не сигнал
  step2_rules: [R2_bankruptcy, R1_status, R4_blocks]

identification:
  # ОКВЭД вашей отрасли и ваших заказчиков: подсказка при выборе из тёзок (правило mOS «по подсказкам»).
  # Пример ниже — комплектация электросетевого строительства (ЖБ и стальные опоры, прокат, электротехника).
  industry_okved: ["23.61", "24.", "25.1", "25.9", "27.", "28.", "35.1", "35.3", "36.", "42.2", "43.2",
                   "46.69", "46.72", "46.73", "46.74", "46.9", "49.2", "52.2", "71.1"]

profiles:
  # ОКОПФ: учреждения не банкротятся, их бухгалтерия бюджетная — финансовые флаги не применяем
  budget_okopf_prefix: ["75", "7.5"]
  unitary_okopf_prefix: ["652", "651"]

deep:
  # глубокий разбор красной карточки (методика mOS). Бюджет — потолок, а не цель: глубина важнее экономии,
  # но каждая ступень ограничена, и расход пишется в отчёт.
  budget_tokens: 60000       # потолок на одну компанию
  run_budget_tokens: 300000  # на весь прогон: сначала красные, затем жёлтые по тяжести флагов (≈ 10 разборов)
  est_tokens_per_company: 30000   # следующий разбор берётся, только если столько ещё есть в остатке
  max_companies: 12
  severity:                  # тяжесть жёлтой карточки = Σ вес правила × вес вида источника
    kind: {fact: 1.0, fact2: 0.8, hypothesis: 0.4}
    default: 1.0
    rules:
      P1_link: 3             # риск связанных компаний (владелец, дочка)
      P2_sister: 2.5
      R: 3                   # красное, сниженное перекрёстной проверкой до жёлтого
      Y8_arb: 3              # иски к компании ≥ 10 % выручки
      Y20_many_suits: 2.5
      Y9_fssp: 2.5
      Y10_tax: 2
      Y13_equity: 2
      Y2_bankr_intent: 2
      Y12_loss: 1.5
      Y19_rev_drop: 1.5
      Y11_mass: 1.5
      Y15_young: 1.5
      Y6_sanctions: 0.5      # сигнал менеджеру, не стоп-фактор
      Y17_media: 1           # гипотеза, вес вида 0.4 сверху
  acts: 2                    # судебных актов по номерам дел из графа (sudact.ru, единичное чтение)
  news: 8                    # заголовков новостей
  web_searches: 4            # веб-поисков (Haiku, только WebSearch, одним ходом)
  web_pages: 3               # страниц, которые откроет код по указателям (витрины исключены)
  pointer_model: haiku
  extract_model: haiku       # чтение материалов — 1 ход без инструментов, цитаты сверяет код
  write_model: sonnet        # сводка и критик — средняя модель (техпроект)
  critic_model: sonnet

frontier:
  # волна фронтира (mOS): после скоринга раскрыть неразобранных соседей-ЮЛ на одном шаге официальной карточкой ФНС
  colors: [red, yellow]      # для каких карточек
  per_company: 3             # узлов на компанию за волну (≈ 4 запроса к pb.nalog.ru на узел)
